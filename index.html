<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#23252d">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="google-fonts" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <title>Web-Publish Studio</title>
  <style>
    :root {
      --app-bg: #2f3138;
      --panel-bg: #f6f4ef;
      --panel-border: #ded9ce;
      --ink: #171717;
      --muted: #6d6a63;
      --accent: #2667ff;
      --accent-dark: #1d4fd0;
      --control-bg: #ffffff;
      --page-shadow: rgba(18, 18, 18, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--app-bg);
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) 318px;
      grid-template-rows: 52px minmax(0, 1fr);
      height: 100vh;
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 1rem;
      background: #202127;
      border-bottom: 1px solid #3e414b;
      color: #f5f5f5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 230px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: #ffffff;
      color: #202127;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      padding: 0.9rem 0.55rem;
      background: #262830;
      border-right: 1px solid #3e414b;
    }

    .tool-button {
      width: 48px;
      height: 48px;
      border: 1px solid #464956;
      border-radius: 12px;
      color: #f5f5f5;
      background: #30333d;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.16s, background 0.16s, transform 0.16s;
    }

    .tool-button:hover,
    .tool-button.active {
      border-color: #8da7ff;
      background: #38415d;
    }

    .tool-button:active {
      transform: translateY(1px);
    }

    .tool-button svg {
      width: 23px;
      height: 23px;
      stroke-width: 1.8;
    }

    .workspace {
      position: relative;
      overflow: auto;
      display: grid;
      place-items: start center;
      padding: 42px;
      background:
        linear-gradient(45deg, rgba(255,255,255,0.04) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.04) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.04) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.04) 75%);
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
    }

    .page-shell {
      position: relative;
      width: 794px;
      height: 1123px;
      margin-bottom: 42px;
      background: #ffffff;
      box-shadow: 0 18px 50px var(--page-shadow);
    }

    .page-rulers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right, rgba(38, 103, 255, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(38, 103, 255, 0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 1;
    }

    canvas {
      position: relative;
      z-index: 2;
      display: block;
    }

    .properties {
      overflow: auto;
      padding: 1rem;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
    }

    .panel-section {
      padding: 0.85rem;
      margin-bottom: 0.85rem;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.66);
    }

    .panel-section h2 {
      margin: 0 0 0.75rem;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .field {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 0.7rem;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: #4b4842;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfc8ba;
      border-radius: 9px;
      padding: 0.52rem 0.58rem;
      background: var(--control-bg);
      color: var(--ink);
      outline: none;
    }

    input[type="color"] {
      width: 100%;
      height: 38px;
      border: 1px solid #cfc8ba;
      border-radius: 9px;
      padding: 3px;
      background: var(--control-bg);
      cursor: pointer;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
      line-height: 1.45;
    }

    .button,
    .icon-button {
      border: 1px solid #cfc8ba;
      border-radius: 10px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.16s, border-color 0.16s, color 0.16s;
    }

    .button {
      min-height: 36px;
      padding: 0.5rem 0.72rem;
      font-weight: 700;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .button.primary:hover {
      background: var(--accent-dark);
    }

    .button:hover,
    .icon-button:hover,
    .icon-button.active {
      border-color: #9b8f7d;
      background: #f0ece4;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .icon-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
    }

    .icon-button {
      min-height: 36px;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .status {
      color: #d9d9d9;
      font-size: 13px;
    }

    .hidden-input {
      display: none;
    }

    .selected-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      color: var(--muted);
      font-size: 12px;
    }

    .selected-info strong {
      color: var(--ink);
    }

    .danger {
      color: #a53535;
    }

    @media (max-width: 1050px) {
      .app {
        grid-template-columns: 64px minmax(0, 1fr) 280px;
      }

      .workspace {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">Wp</div>
        <div>
          <h1>Web-Publish Studio</h1>
          <div class="status" id="status">Outil Sélection actif</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="button" id="addTextTop">Bloc texte</button>
        <button class="button" id="addImageTop">Importer image</button>
        <button class="button primary" id="exportPng">Exporter PNG</button>
      </div>
    </header>

    <nav class="toolbar" aria-label="Outils de mise en page">
      <button class="tool-button active" data-tool="select" title="Outil Sélection" aria-label="Outil Sélection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 3l7.8 17 2-7 7-2L4 3z"/></svg>
      </button>
      <button class="tool-button" data-tool="text" title="Outil Texte" aria-label="Outil Texte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6V4h16v2"/><path d="M12 4v16"/><path d="M8 20h8"/></svg>
      </button>
      <button class="tool-button" data-tool="shape" title="Outil Forme" aria-label="Outil Forme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
    </nav>

    <main class="workspace" id="workspace">
      <div class="page-shell" id="pageShell">
        <div class="page-rulers" aria-hidden="true"></div>
        <canvas id="pageCanvas" width="794" height="1123"></canvas>
      </div>
    </main>

    <aside class="properties" aria-label="Panneau de propriétés">
      <section class="panel-section">
        <h2>Page</h2>
        <div class="field">
          <label for="pageColor">Couleur de fond</label>
          <input type="color" id="pageColor" value="#ffffff">
        </div>
        <div class="field">
          <label for="pageHex">Hexadécimal</label>
          <input type="text" id="pageHex" value="#ffffff" maxlength="7">
        </div>
        <div class="button-grid">
          <button class="button" id="setBackgroundImage">Image de fond</button>
          <button class="button" id="clearBackgroundImage">Retirer fond</button>
        </div>
      </section>

      <section class="panel-section">
        <h2>Insertion</h2>
        <div class="button-grid">
          <button class="button" id="addText">Zone de texte</button>
          <button class="button" id="addShape">Rectangle</button>
          <button class="button" id="addImage">Image décor</button>
          <button class="button danger" id="deleteObject">Supprimer</button>
        </div>
        <p class="hint" style="margin-top:0.7rem">Les objets sélectionnés affichent des poignées carrées pour redimensionner, et une poignée supérieure pour pivoter.</p>
      </section>

      <section class="panel-section">
        <h2>Sélection</h2>
        <div class="selected-info">
          <span>Objet actif</span>
          <strong id="selectionType">Aucun</strong>
        </div>
        <div class="field-row" style="margin-top:0.7rem">
          <div class="field">
            <label for="objectX">X</label>
            <input type="number" id="objectX" min="0" step="1">
          </div>
          <div class="field">
            <label for="objectY">Y</label>
            <input type="number" id="objectY" min="0" step="1">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="objectW">Largeur</label>
            <input type="number" id="objectW" min="1" step="1">
          </div>
          <div class="field">
            <label for="objectH">Hauteur</label>
            <input type="number" id="objectH" min="1" step="1">
          </div>
        </div>
      </section>

      <section class="panel-section" id="textPanel">
        <h2>Texte</h2>
        <div class="field">
          <label for="textContent">Contenu</label>
          <textarea id="textContent" placeholder="Sélectionnez un bloc de texte"></textarea>
          <button class="button" id="editText" type="button">Éditer sur la page</button>
        </div>
        <div class="field">
          <label for="fontFamily">Police Google Fonts</label>
          <select id="fontFamily">
            <option value="Inter">Inter</option>
            <option value="Roboto">Roboto</option>
            <option value="Merriweather">Merriweather</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Montserrat">Montserrat</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="fontSize">Taille pt</label>
            <input type="number" id="fontSize" value="24" min="6" max="180">
          </div>
          <div class="field">
            <label for="lineHeight">Interlignage</label>
            <input type="number" id="lineHeight" value="1.2" min="0.6" max="4" step="0.05">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="charSpacing">Interlettrage</label>
            <input type="number" id="charSpacing" value="0" min="-200" max="900" step="10">
          </div>
          <div class="field">
            <label for="textColor">Couleur</label>
            <input type="color" id="textColor" value="#161616">
          </div>
        </div>
        <div class="field">
          <label>Justification</label>
          <div class="icon-group" id="alignGroup">
            <button class="icon-button active" data-align="left" aria-label="Aligner à gauche">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h15M4 10h10M4 14h15M4 18h10"/></svg>
            </button>
            <button class="icon-button" data-align="center" aria-label="Centrer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 6h14M8 10h8M5 14h14M8 18h8"/></svg>
            </button>
            <button class="icon-button" data-align="right" aria-label="Aligner à droite">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 6h15M10 10h10M5 14h15M10 18h10"/></svg>
            </button>
            <button class="icon-button" data-align="justify" aria-label="Justification totale">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label>Styles et effets</label>
          <div class="icon-group">
            <button class="icon-button" id="boldBtn" aria-label="Gras">B</button>
            <button class="icon-button" id="italicBtn" aria-label="Italique"><em>I</em></button>
            <button class="icon-button" id="underlineBtn" aria-label="Souligné"><span style="text-decoration:underline">U</span></button>
            <button class="icon-button" id="shadowBtn" aria-label="Ombre portée">S</button>
          </div>
        </div>
      </section>

      <section class="panel-section">
        <h2>Objet</h2>
        <div class="field-row">
          <div class="field">
            <label for="fillColor">Remplissage</label>
            <input type="color" id="fillColor" value="#f1c453">
          </div>
          <div class="field">
            <label for="opacity">Opacité</label>
            <input type="number" id="opacity" value="100" min="5" max="100" step="5">
          </div>
        </div>
        <div class="button-grid">
          <button class="button" id="bringForward">Avant</button>
          <button class="button" id="sendBackward">Arrière</button>
        </div>
      </section>

      <input class="hidden-input" type="file" id="imageInput" accept="image/*">
      <input class="hidden-input" type="file" id="backgroundInput" accept="image/*">
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.1/dist/fabric.min.js"></script>
  <script>
    const PAGE = { width: 794, height: 1123 };
    const DEFAULT_TEXT = "Cliquez pour éditer ce bloc de texte. Utilisez la justification totale pour répartir l'espace entre les mots et obtenir des bords parfaitement alignés.";
    const FONTS = ["Inter", "Roboto", "Merriweather", "Playfair Display", "Montserrat"];

    const canvas = new fabric.Canvas("pageCanvas", {
      width: PAGE.width,
      height: PAGE.height,
      backgroundColor: "#ffffff",
      preserveObjectStacking: true,
      selection: true
    });

    const els = {
      status: document.getElementById("status"),
      toolButtons: document.querySelectorAll(".tool-button"),
      addText: document.getElementById("addText"),
      addTextTop: document.getElementById("addTextTop"),
      addShape: document.getElementById("addShape"),
      addImage: document.getElementById("addImage"),
      addImageTop: document.getElementById("addImageTop"),
      imageInput: document.getElementById("imageInput"),
      backgroundInput: document.getElementById("backgroundInput"),
      setBackgroundImage: document.getElementById("setBackgroundImage"),
      clearBackgroundImage: document.getElementById("clearBackgroundImage"),
      pageColor: document.getElementById("pageColor"),
      pageHex: document.getElementById("pageHex"),
      selectionType: document.getElementById("selectionType"),
      objectX: document.getElementById("objectX"),
      objectY: document.getElementById("objectY"),
      objectW: document.getElementById("objectW"),
      objectH: document.getElementById("objectH"),
      textContent: document.getElementById("textContent"),
      editText: document.getElementById("editText"),
      fontFamily: document.getElementById("fontFamily"),
      fontSize: document.getElementById("fontSize"),
      lineHeight: document.getElementById("lineHeight"),
      charSpacing: document.getElementById("charSpacing"),
      textColor: document.getElementById("textColor"),
      alignButtons: document.querySelectorAll("#alignGroup .icon-button"),
      boldBtn: document.getElementById("boldBtn"),
      italicBtn: document.getElementById("italicBtn"),
      underlineBtn: document.getElementById("underlineBtn"),
      shadowBtn: document.getElementById("shadowBtn"),
      fillColor: document.getElementById("fillColor"),
      opacity: document.getElementById("opacity"),
      bringForward: document.getElementById("bringForward"),
      sendBackward: document.getElementById("sendBackward"),
      deleteObject: document.getElementById("deleteObject"),
      exportPng: document.getElementById("exportPng")
    };

    let activeTool = "select";
    let pendingImageMode = "decor";

    fabric.Object.prototype.transparentCorners = false;
    fabric.Object.prototype.cornerColor = "#ffffff";
    fabric.Object.prototype.cornerStrokeColor = "#2667ff";
    fabric.Object.prototype.borderColor = "#2667ff";
    fabric.Object.prototype.cornerStyle = "rect";
    fabric.Object.prototype.cornerSize = 12;
    fabric.Object.prototype.padding = 4;
    fabric.Object.prototype.rotatingPointOffset = 38;

    function setTool(tool) {
      activeTool = tool;
      canvas.isDrawingMode = false;
      canvas.selection = tool === "select";
      els.toolButtons.forEach((button) => button.classList.toggle("active", button.dataset.tool === tool));
      els.status.textContent = `Outil ${tool === "select" ? "Sélection" : tool === "text" ? "Texte" : "Forme"} actif`;
      canvas.defaultCursor = tool === "text" ? "text" : tool === "shape" ? "crosshair" : "default";
    }

    function constrainToPage(object) {
      const bounds = object.getBoundingRect(true, true);
      if (bounds.left < 0) object.left -= bounds.left;
      if (bounds.top < 0) object.top -= bounds.top;
      if (bounds.left + bounds.width > PAGE.width) object.left -= bounds.left + bounds.width - PAGE.width;
      if (bounds.top + bounds.height > PAGE.height) object.top -= bounds.top + bounds.height - PAGE.height;
      object.setCoords();
    }

    function createTextBox(left = 104, top = 110) {
      const textbox = new fabric.Textbox(DEFAULT_TEXT, {
        left,
        top,
        width: 330,
        fontFamily: "Inter",
        fontSize: 24,
        fill: "#161616",
        lineHeight: 1.2,
        charSpacing: 0,
        textAlign: "left",
        splitByGrapheme: false,
        padding: 8,
        objectCaching: false
      });
      canvas.add(textbox);
      canvas.setActiveObject(textbox);
      requestAnimationFrame(() => editActiveText(true));
      canvas.requestRenderAll();
      updatePanel();
      return textbox;
    }

    function editActiveText(selectAll = false) {
      const object = canvas.getActiveObject();
      if (!isTextObject(object)) return;
      canvas.setActiveObject(object);
      object.enterEditing();
      if (selectAll) object.selectAll();
      if (object.hiddenTextarea) object.hiddenTextarea.focus();
      canvas.requestRenderAll();
      els.status.textContent = "Édition texte active — saisissez au clavier, Échap pour sortir";
    }

    function createShape(left = 156, top = 180) {
      const rect = new fabric.Rect({
        left,
        top,
        width: 180,
        height: 120,
        fill: "#f1c453",
        stroke: "#7d6323",
        strokeWidth: 1,
        rx: 2,
        ry: 2,
        opacity: 1
      });
      canvas.add(rect);
      canvas.setActiveObject(rect);
      canvas.requestRenderAll();
      updatePanel();
      return rect;
    }

    function addImageFromFile(file, asBackground = false) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        fabric.Image.fromURL(event.target.result, (image) => {
          if (asBackground) {
            const scale = Math.max(PAGE.width / image.width, PAGE.height / image.height);
            image.set({
              originX: "left",
              originY: "top",
              left: 0,
              top: 0,
              scaleX: scale,
              scaleY: scale,
              selectable: false,
              evented: false
            });
            canvas.setBackgroundImage(image, canvas.renderAll.bind(canvas));
            return;
          }

          const maxWidth = 360;
          const scale = image.width > maxWidth ? maxWidth / image.width : 1;
          image.set({
            left: 130,
            top: 150,
            scaleX: scale,
            scaleY: scale,
            cornerColor: "#ffffff",
            cornerStrokeColor: "#2667ff"
          });
          canvas.add(image);
          canvas.setActiveObject(image);
          canvas.requestRenderAll();
          updatePanel();
        }, { crossOrigin: "anonymous" });
      };
      reader.readAsDataURL(file);
    }

    function getObjectDimensions(object) {
      return {
        width: Math.round(object.getScaledWidth()),
        height: Math.round(object.getScaledHeight())
      };
    }

    function isTextObject(object) {
      return object && (object.type === "textbox" || object.type === "i-text" || object.type === "text");
    }

    function getObjectLabel(object) {
      if (!object) return "Aucun";
      if (isTextObject(object)) return "Texte";
      if (object.type === "image") return "Image";
      if (object.type === "rect") return "Forme";
      if (object.type === "activeSelection") return "Sélection";
      return object.type;
    }

    function normalizeTextAfterScaling(object) {
      if (!isTextObject(object)) return;
      // Fabric redimensionne les Textbox par scaleX. On convertit ce geste souris en largeur réelle
      // pour conserver une typographie éditable et une justification inter-mots fiable.
      object.set({
        width: Math.max(40, object.width * object.scaleX),
        scaleX: 1
      });
      object.setCoords();
    }

    function syncControlStates(object) {
      if (!object) {
        els.selectionType.textContent = "Aucun";
        return;
      }

      const dims = getObjectDimensions(object);
      els.selectionType.textContent = getObjectLabel(object);
      els.objectX.value = Math.round(object.left || 0);
      els.objectY.value = Math.round(object.top || 0);
      els.objectW.value = dims.width;
      els.objectH.value = dims.height;
      els.opacity.value = Math.round((object.opacity ?? 1) * 100);

      if (object.fill && typeof object.fill === "string") {
        els.fillColor.value = object.fill;
      }

      if (isTextObject(object)) {
        els.textContent.value = object.text || "";
        els.fontFamily.value = object.fontFamily || "Inter";
        els.fontSize.value = Math.round(object.fontSize || 24);
        els.lineHeight.value = object.lineHeight || 1.2;
        els.charSpacing.value = object.charSpacing || 0;
        els.textColor.value = object.fill || "#161616";
        els.boldBtn.classList.toggle("active", object.fontWeight === "700" || object.fontWeight === "bold");
        els.italicBtn.classList.toggle("active", object.fontStyle === "italic");
        els.underlineBtn.classList.toggle("active", Boolean(object.underline));
        els.shadowBtn.classList.toggle("active", Boolean(object.shadow));
        els.alignButtons.forEach((button) => button.classList.toggle("active", button.dataset.align === object.textAlign));
      }
    }

    function updatePanel() {
      syncControlStates(canvas.getActiveObject());
    }

    function applyToActive(updates) {
      const object = canvas.getActiveObject();
      if (!object) return;
      object.set(updates);
      object.setCoords();
      canvas.requestRenderAll();
      updatePanel();
    }

    function applyToText(updates) {
      const object = canvas.getActiveObject();
      if (!isTextObject(object)) return;
      object.set(updates);
      object.initDimensions();
      object.setCoords();
      canvas.requestRenderAll();
      updatePanel();
    }

    function applyGeometry() {
      const object = canvas.getActiveObject();
      if (!object) return;

      const nextWidth = Number(els.objectW.value);
      const nextHeight = Number(els.objectH.value);
      const currentWidth = object.width || object.getScaledWidth();
      const currentHeight = object.height || object.getScaledHeight();

      object.set({
        left: Number(els.objectX.value),
        top: Number(els.objectY.value)
      });

      if (isTextObject(object)) {
        object.set({
          width: Math.max(40, nextWidth),
          scaleX: 1,
          scaleY: Math.max(0.1, nextHeight / currentHeight)
        });
      } else {
        object.set({
          scaleX: Math.max(0.05, nextWidth / currentWidth),
          scaleY: Math.max(0.05, nextHeight / currentHeight)
        });
      }

      constrainToPage(object);
      canvas.requestRenderAll();
      updatePanel();
    }

    function setPageColor(color) {
      if (!/^#[0-9a-f]{6}$/i.test(color)) return;
      canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
      els.pageColor.value = color;
      els.pageHex.value = color;
    }

    function exportCanvas() {
      const link = document.createElement("a");
      link.href = canvas.toDataURL({ format: "png", multiplier: 2 });
      link.download = "web-publish-page.png";
      link.click();
    }

    function loadFont(fontName) {
      if (!FONTS.includes(fontName)) return;
      document.fonts.load(`16px "${fontName}"`).then(() => {
        canvas.requestRenderAll();
      });
    }

    canvas.on("mouse:down", (event) => {
      if (event.target || activeTool === "select") return;
      const pointer = canvas.getPointer(event.e);
      if (activeTool === "text") {
        createTextBox(pointer.x, pointer.y);
        setTool("select");
      }
      if (activeTool === "shape") {
        createShape(pointer.x, pointer.y);
        setTool("select");
      }
    });
    canvas.on("mouse:dblclick", (event) => {
      if (isTextObject(event.target)) editActiveText(false);
    });

    canvas.on("selection:created", updatePanel);
    canvas.on("selection:updated", updatePanel);
    canvas.on("selection:cleared", updatePanel);
    canvas.on("object:moving", (event) => {
      constrainToPage(event.target);
      updatePanel();
    });
    canvas.on("object:scaling", (event) => {
      normalizeTextAfterScaling(event.target);
      updatePanel();
    });
    canvas.on("object:modified", (event) => {
      normalizeTextAfterScaling(event.target);
      constrainToPage(event.target);
      updatePanel();
    });
    canvas.on("object:rotating", updatePanel);
    canvas.on("text:changed", updatePanel);

    els.toolButtons.forEach((button) => button.addEventListener("click", () => setTool(button.dataset.tool)));
    els.addText.addEventListener("click", () => createTextBox());
    els.addTextTop.addEventListener("click", () => createTextBox());
    els.addShape.addEventListener("click", () => createShape());
    els.addImage.addEventListener("click", () => {
      pendingImageMode = "decor";
      els.imageInput.click();
    });
    els.addImageTop.addEventListener("click", () => {
      pendingImageMode = "decor";
      els.imageInput.click();
    });
    els.setBackgroundImage.addEventListener("click", () => els.backgroundInput.click());
    els.clearBackgroundImage.addEventListener("click", () => {
      canvas.setBackgroundImage(null, canvas.renderAll.bind(canvas));
    });
    els.imageInput.addEventListener("change", () => {
      addImageFromFile(els.imageInput.files[0], pendingImageMode === "background");
      els.imageInput.value = "";
    });
    els.backgroundInput.addEventListener("change", () => {
      addImageFromFile(els.backgroundInput.files[0], true);
      els.backgroundInput.value = "";
    });

    els.pageColor.addEventListener("input", () => setPageColor(els.pageColor.value));
    els.pageHex.addEventListener("change", () => setPageColor(els.pageHex.value));
    [els.objectX, els.objectY, els.objectW, els.objectH].forEach((input) => input.addEventListener("change", applyGeometry));

    els.textContent.addEventListener("input", () => applyToText({ text: els.textContent.value }));
    els.editText.addEventListener("click", () => editActiveText(false));
    els.fontFamily.addEventListener("change", () => {
      loadFont(els.fontFamily.value);
      applyToText({ fontFamily: els.fontFamily.value });
    });
    els.fontSize.addEventListener("change", () => applyToText({ fontSize: Number(els.fontSize.value) }));
    els.lineHeight.addEventListener("change", () => applyToText({ lineHeight: Number(els.lineHeight.value) }));
    els.charSpacing.addEventListener("change", () => applyToText({ charSpacing: Number(els.charSpacing.value) }));
    els.textColor.addEventListener("input", () => applyToText({ fill: els.textColor.value }));
    els.alignButtons.forEach((button) => {
      button.addEventListener("click", () => {
        applyToText({ textAlign: button.dataset.align });
      });
    });

    els.boldBtn.addEventListener("click", () => {
      const object = canvas.getActiveObject();
      if (!isTextObject(object)) return;
      applyToText({ fontWeight: object.fontWeight === "700" || object.fontWeight === "bold" ? "400" : "700" });
    });
    els.italicBtn.addEventListener("click", () => {
      const object = canvas.getActiveObject();
      if (!isTextObject(object)) return;
      applyToText({ fontStyle: object.fontStyle === "italic" ? "normal" : "italic" });
    });
    els.underlineBtn.addEventListener("click", () => {
      const object = canvas.getActiveObject();
      if (!isTextObject(object)) return;
      applyToText({ underline: !object.underline });
    });
    els.shadowBtn.addEventListener("click", () => {
      const object = canvas.getActiveObject();
      if (!isTextObject(object)) return;
      applyToText({
        shadow: object.shadow ? null : new fabric.Shadow({
          color: "rgba(0,0,0,0.35)",
          blur: 5,
          offsetX: 3,
          offsetY: 3
        })
      });
    });

    els.fillColor.addEventListener("input", () => applyToActive({ fill: els.fillColor.value }));
    els.opacity.addEventListener("change", () => applyToActive({ opacity: Number(els.opacity.value) / 100 }));
    els.bringForward.addEventListener("click", () => {
      const object = canvas.getActiveObject();
      if (!object) return;
      canvas.bringForward(object);
      canvas.requestRenderAll();
    });
    els.sendBackward.addEventListener("click", () => {
      const object = canvas.getActiveObject();
      if (!object) return;
      canvas.sendBackwards(object);
      canvas.requestRenderAll();
    });
    els.deleteObject.addEventListener("click", () => {
      const object = canvas.getActiveObject();
      if (!object) return;
      canvas.remove(object);
      canvas.discardActiveObject();
      canvas.requestRenderAll();
      updatePanel();
    });
    els.exportPng.addEventListener("click", exportCanvas);

    document.addEventListener("keydown", (event) => {
      const object = canvas.getActiveObject();
      const tag = document.activeElement?.tagName;
      if (event.key === "Enter" && isTextObject(object) && tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") {
        event.preventDefault();
        editActiveText(false);
        return;
      }
      if (event.key === "Escape" && isTextObject(object) && object.isEditing) {
        object.exitEditing();
        els.status.textContent = "Outil Sélection actif";
        canvas.requestRenderAll();
        return;
      }
      if (!object || tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (event.key === "Delete" || event.key === "Backspace") {
        canvas.remove(object);
        canvas.discardActiveObject();
        updatePanel();
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }

    createTextBox(92, 92);
    canvas.getActiveObject().exitEditing();
    createShape(456, 168);
    canvas.discardActiveObject();
    updatePanel();
  </script>
</body>
</html>
